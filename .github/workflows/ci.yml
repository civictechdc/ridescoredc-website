name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  STG_SERVER: dev.ridescoredc.com
  STG_USER: fastapi
  STG_PORT: 22
  STG_PATH: /opt/ridescoredc-website
  PRD_SERVER: ridescoredc.com
  PRD_USER: ubuntu
  PRD_PORT: 22
  PRD_PATH: /opt/ridescoredc-website

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check api/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements-dev.txt
      - run: pytest api/tests/ -v
        env:
          DATABASE_URL: postgresql://mock:mock@localhost/mock

  stage:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://dev.ridescoredc.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        env:
          STG_SSH_PRIVATE_KEY: ${{ secrets.STG_SSH_PRIVATE_KEY }}
        run: |
          eval $(ssh-agent -s)
          echo "$STG_SSH_PRIVATE_KEY" | ssh-add -
          ssh -p $STG_PORT $STG_USER@$STG_SERVER 'bash -s' < scripts/gitlab-ci/deployment.sh $STG_PATH $STG_USER develop
          touch deploy-success

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ridescoredc.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        env:
          PRD_SSH_PRIVATE_KEY: ${{ secrets.PRD_SSH_PRIVATE_KEY }}
        run: |
          eval $(ssh-agent -s)
          echo "$PRD_SSH_PRIVATE_KEY" | ssh-add -
          ssh -p $PRD_PORT $PRD_USER@$PRD_SERVER 'bash -s' < scripts/gitlab-ci/deployment.sh $PRD_PATH $PRD_USER main
          touch deploy-success
