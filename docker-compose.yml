services:
  # Single entry point — mirrors the staging/prod NGINX routing.
  # Routes /tiles/ -> martin and everything else -> fastapi.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi
      - martin

  # Internal only — reached through nginx, not published to the host.
  fastapi:
    image: python:3.12-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./api:/app
      # The pages, mounted so that /app/../frontend resolves the same way here
      # as it does in a checkout and on the servers. Editing a page takes effect
      # on reload; no restart, and nothing is copied into the image.
      - ./frontend:/frontend
    # --reload so an edit to api/ takes effect without restarting the
    # container. Local only: the servers do not start the service through
    # Compose, so a service that restarts itself on every file change cannot
    # reach production.
    command: sh -c "pip install -r requirements-dev.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    expose:
      - "8000"
    env_file:
      - ./api/.env
    depends_on:
      - db

  # Internal only — reached through nginx at /tiles/, not published to the host.
  martin:
    image: ghcr.io/maplibre/martin:1.3.1
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./api/.env
    environment:
      - MARTIN_CACHE_SIZE=0
    volumes:
      - ./martin.yaml:/martin.yaml
    command: ["--config", "/martin.yaml"]
    depends_on:
      - db

  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
    # Published so that psql and the data-package loader can reach the database
    # from your machine. The app and Martin do not use this port: they reach the
    # database inside Compose's own network, by the service name "db".
    #
    # Set DB_PORT if 5432 is already taken -- by a Postgres you installed, or by
    # another project's container.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # The database keeps its files in a directory on your machine rather than
      # inside the container, so they survive the container being removed.
      #
      # Set DB_DATA_DIR to put them somewhere else: to keep more than one
      # database side by side, or to start from an empty one without deleting
      # the directory you already have.
      - ${DB_DATA_DIR:-./pg_data}:/var/lib/postgresql/data