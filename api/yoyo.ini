[DEFAULT]
sources = %(here)s/migrations

# These migrations own the app schema only. The bike-safety data is built by
# ridescoredc-models and loaded from a published package, so it has no
# migrations and must not be described here.
#
# Its own ledger table, because both repositories write to one database and a
# shared ledger would have each one seeing the other's migrations as missing.
migration_table = _yoyo_migration_app

# Apply without prompting. Remove for a step-through run.
batch_mode = on
verbosity = 1

# The database is given at apply time and never stored here. yoyo picks its
# driver from the URL scheme, so it needs postgresql+psycopg:// where psql and
# Martin take postgres://
#
#   YOYO_DB="postgresql+psycopg://${DATABASE_URL#postgres*://}"
#   yoyo list  --database "$YOYO_DB" --config api/yoyo.ini
#   yoyo apply --database "$YOYO_DB" --config api/yoyo.ini
