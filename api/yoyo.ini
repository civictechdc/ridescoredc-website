[DEFAULT]
# No sources setting on purpose. yoyo splits that value on whitespace, so a
# checkout under a directory such as "Ride Score DC" leaves it searching for
# fragments of the path and finding nothing, which it reports as success.
# Worse, a setting that is present but useless is still truthy, which is what
# stops yoyo raising "Please specify the migration source directory" -- the
# error that would have said what was wrong. Leaving it out keeps that error.
# scripts/migrate.py passes the directory on the command line instead, where a
# space is safe. Pass api/migrations yourself when running yoyo by hand.

# These migrations own the app schema only. The bike-safety data is built by
# ridescoredc-models and loaded from a published package, so it has no
# migrations and must not be described here.
#
# Its own ledger table, because both repositories write to one database and a
# shared ledger would have each one seeing the other's migrations as missing.
migration_table = _yoyo_migration_app

# Apply without prompting. Remove for a step-through run.
batch_mode = on
verbosity = 1

# The database is given at apply time and never stored here. yoyo picks its
# driver from the URL scheme, so it needs postgresql+psycopg:// where psql and
# Martin take postgres://
#
#   YOYO_DB="postgresql+psycopg://${DATABASE_URL#postgres*://}"
#   yoyo list  --database "$YOYO_DB" --config api/yoyo.ini api/migrations
#   yoyo apply --database "$YOYO_DB" --config api/yoyo.ini api/migrations
