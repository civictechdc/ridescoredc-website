# Martin serves map tiles. It publishes only what the serving schema exposes.
#
# The road data itself lives in the data schema and is deliberately not listed
# here: what a map shows is a presentation decision, and the serving schema is
# where those decisions are written. Publishing the data schema directly would
# put every column of every table on the open internet, including scores that
# the survey must not show its respondents.
postgres:
  connection_string: ${DATABASE_URL}
  # Serve every source everywhere, rather than only inside the area its rows
  # covered when Martin started. Martin works that area out once, at startup,
  # and answers every tile outside it with nothing. That is harmless for road
  # data, which only changes on a load (and a load restarts Martin), but
  # serving.rider_hazard grows as people answer the survey: a street rated for
  # the first time outside the old area would stay invisible until a restart.
  auto_bounds: skip
  auto_publish:
    tables:
      from_schemas:
        - serving
    functions:
      from_schemas:
        - serving

# No tile cache. Martin keeps a cached tile until it restarts, and this version
# can neither expire tiles nor leave one source out of the cache. Road data only
# changes on a load, which restarts Martin, but serving.rider_hazard changes
# with every survey response, so a cached tile would hide new ratings until the
# next deploy. Every tile is built from the database instead; the road network
# is small and indexed, so that is cheap.
#
# MARTIN_CACHE_SIZE in docker-compose.yml is not read by this Martin version;
# this is the setting that takes effect.
# cache_size_mb rather than tile_cache_size_mb: this version ignores the
# latter unless the former is also set. It turns off Martin's other caches
# too, which hold fonts, sprites and PMTiles, none of which this site uses.
cache_size_mb: 0
