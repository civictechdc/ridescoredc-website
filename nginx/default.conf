# Local reverse proxy — mirrors the staging/production NGINX routing so the
# frontend's relative /tiles/ and /api URLs behave the same everywhere.
server {
    listen 80;
    server_name localhost;

    # Tiles → Martin. The trailing slash on proxy_pass strips the /tiles/
    # prefix, so /tiles/update_score/1/2/3 reaches Martin as /update_score/1/2/3.
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (the app, static files, and /api) → FastAPI.
    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
