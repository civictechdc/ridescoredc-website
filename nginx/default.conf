# Local reverse proxy. Mirrors the staging and production routing, so a URL
# behaves the same on your machine as it does once deployed.
#
# Three kinds of request, three destinations:
#
#   the pages   served here, straight from disk
#   /tiles/     Martin, which reads the serving schema
#   /api/       the API, which records survey responses
#
# nginx serves the pages rather than handing them to the API. Serving files is
# what nginx is for, and it leaves the API handling only the one thing it does.
# It also means a single rule decides how a URL becomes a file, and that rule is
# used both here and on the servers.
server {
    listen 80;
    server_name localhost;

    # The pages. try_files turns /survey/ into survey/index.html, so a page's
    # address is its folder. A request for something that does not exist is
    # answered here and never reaches the API.
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/index.html =404;
    }

    # Tiles -> Martin. The trailing slash on proxy_pass strips the prefix, so
    # /tiles/crashes/1/2/3 reaches Martin as /crashes/1/2/3.
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Survey responses -> the API. No trailing slash on proxy_pass, so the
    # /api/ prefix is kept and the route the API declares is the route that
    # arrives.
    location /api/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Whether the API can reach the database. Used by deployment checks.
    location = /health {
        proxy_pass http://fastapi:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
